<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書の価値観診断 16タイプ一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Shippori Mincho"', 'serif'],
            sans: ['"Zen Kaku Gothic New"', 'sans-serif'],
          },
          colors: {
            book: {
              bg: '#f8f6f0',
              card: '#ffffff',
              primary: '#2c3e35',
              accent: '#c59b27',
              text: '#2b2b2b',
              muted: '#6b7280',
              border: '#e5e0d8',
              lightBg: '#f3efe6',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="types.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 md:p-8">

  <!-- ヘッダー -->
  <header class="w-full max-w-6xl py-4 border-b border-book-border flex justify-between items-center mb-8">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6 text-book-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
      </svg>
      <span class="font-serif font-bold text-lg text-book-primary tracking-wider">読書の価値観診断 16タイプ一覧</span>
    </div>
    <span class="text-xs text-book-muted bg-book-lightBg px-3 py-1 rounded-full font-medium">全16タイプ</span>
  </header>

  <!-- メインコンテンツ -->
  <main class="w-full max-w-6xl flex-grow">

    <!-- ページタイトル＆説明 -->
    <div class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-serif font-bold text-book-primary mb-3">
        読書の価値観 16タイプ一覧
      </h1>
      <p class="text-xs sm:text-sm text-book-muted max-w-2xl mx-auto leading-relaxed">
        4つの軸（K/E・A/F・R/I・S/P）の組み合わせから導き出される読書スタイルの全16タイプです。<br class="hidden sm:inline">
        それぞれの読者像が持つ特徴や、本との付き合い方の違いを一覧で比較・確認できます。
      </p>
    </div>

    <!-- 16タイプ一覧グリッド (大画面: 2列、スマホ: 1列) -->
    <div id="type-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
      <!-- JavaScriptで動的生成されます -->
    </div>

  </main>

  <!-- フッター -->
  <footer class="w-full max-w-6xl py-6 border-t border-book-border text-center text-xs text-book-muted mt-8">
    <p>© 読書の価値観診断 | Reading Values Profile</p>
  </footer>
  <script src="types.js" defer></script>
</body>
</html>
